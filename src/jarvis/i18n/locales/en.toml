# English texts. Every key must also exist in pt-BR.toml (checked by the tests).
# A key holds one phrase or a list of variants; one variant is picked at random.

[startup]
morning = [
    "Good morning, sir. All systems are online.",
    "Good morning, Mr. Camprubi. Everything is ready for you.",
]
afternoon = [
    "Good afternoon, sir. All systems are online.",
    "Good afternoon, sir. At your service.",
]
evening = [
    "Good evening, sir. All systems are online.",
    "Good evening, Mr. Camprubi. Systems ready.",
]
night = [
    "Working late, sir? All systems are online.",
    "Still up, sir? The systems are at your disposal.",
]

[pipeline]
not_understood = [
    "I'm afraid I didn't quite catch that, sir.",
    "My apologies, sir. I couldn't make that out.",
]

[router]
unknown = [
    "I'm afraid that is beyond my abilities for now, sir.",
    "That one isn't in my repertoire yet, sir.",
]

[brain]
say = "{text}"
not_configured = "My reasoning service hasn't been set up yet, sir, so I can only manage the simple commands."
unavailable = [
    "I can't reach my reasoning service at the moment, sir.",
    "My higher functions seem to be offline, sir. Do try again shortly.",
]
auth_failed = "My access key to the reasoning service was refused, sir. It may need replacing."
refused = "I'm afraid I can't help with that one, sir."
