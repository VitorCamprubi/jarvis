budget_exhausted = "The budget for my reasoning service is spent, sir. I'll stick to the simple commands."

[confirm]
cancelled = [
    "Very well, sir. I'll leave it.",
    "Understood. Standing down, sir.",
]

[language]
locked = [
    "Very well, sir. English it is, until you say otherwise.",
    "Certainly, sir. I'll speak English from now on.",
]
auto = "Very well, sir. I'll reply in whichever language you speak."

[apps]
opening = ["Opening {app}, sir.", "{app}, coming right up."]
not_found = "I couldn't find an app called {name}, sir."

[sites]
opening = ["Opening {site}, sir.", "{site}, on screen."]
not_found = "I'm afraid I don't know the site {site}, sir."

[files]
found = "I found {count} files, sir. The first is {first}."
found_one = "I found one file, sir: {first}."
none = "I couldn't find any file matching {query}, sir."
opening = "Opening {name}, sir."
revealed = "{name} is a program or a script, sir, so for safety I've only shown it in its folder."
no_results = "There are no search results to open, sir. Ask me to find something first."
no_such_result = "There is no result number {position}, sir."

[system]
summary = "CPU at {cpu} percent, memory at {ram} percent, and the GPU at {gpu} percent, running at {gpu_temp} degrees, sir."
summary_no_gpu = "CPU at {cpu} percent and memory at {ram} percent, sir."

[media]
play_pause = ["Done, sir.", "As you wish."]
next = ["Next track, sir.", "Skipping ahead."]
previous = ["Previous track, sir.", "Going back one."]

[volume]
set = ["Volume at {level} percent, sir.", "Volume set to {level} percent."]
