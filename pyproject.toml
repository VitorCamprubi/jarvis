[project]
name = "jarvis"
version = "0.1.0"
description = "Personal bilingual (pt-BR/en) voice assistant for Windows, inspired by J.A.R.V.I.S."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vitor Camprubi", email = "zevitorcamprubi@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "N",   # pep8 naming
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
