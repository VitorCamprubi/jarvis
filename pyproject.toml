[project]
name = "jarvis"
version = "0.1.0"
description = "Personal bilingual (pt-BR/en) voice assistant for Windows, inspired by J.A.R.V.I.S."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Vitor Camprubi", email = "zevitorcamprubi@gmail.com" }
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "anthropic>=1.13.0",
    "edge-tts>=7.3.1",
    "faster-whisper>=1.2.1",
    "feedparser>=6.0.14",
    "httpx2>=2.13.1",
    "numpy>=2.5.3",
    "nvidia-ml-py>=13.615.71",
    "onnxruntime>=1.31.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyside6-essentials>=6.12.0",
    "rapidfuzz>=3.14.6",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
# The CUDA libraries (~1.3 GB, ADR-014) install by default; CI skips them with --no-group cuda.
default-groups = ["dev", "cuda"]
# faster-whisper's decode_audio passes an argument that PyAV 19 removed.
constraint-dependencies = ["av<19"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-psutil>=7.2.2.20260906",
]
cuda = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "N",   # pep8 naming
    "PTH", # prefer pathlib
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Libraries that ship no type information.
module = [
    "sounddevice",
    "soundfile",
    "onnxruntime",
    "faster_whisper.*",
    "ctranslate2",
    "pynvml",
    "comtypes",
    "pycaw.*",
    "feedparser",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import shared helpers such as fakes.py
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
