name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      # The CUDA libraries (~1.3 GB) are only needed on a GPU; the tests do not use them.
      - name: Install dependencies
        run: uv sync --locked --no-group cuda

      - name: Format
        run: uv run --no-sync ruff format --check

      - name: Lint
        run: uv run --no-sync ruff check

      - name: Type check
        run: uv run --no-sync mypy

      - name: Tests
        run: uv run --no-sync pytest
