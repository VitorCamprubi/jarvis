# JARVIS default configuration.
#
# Do not edit this file to customise your setup. Copy only the keys you want
# to change into config/local.toml (git-ignored); its values override these.
# Secrets (API keys) never go here: they belong in .env.

[logging]
level = "INFO"            # DEBUG, INFO, WARNING, ERROR or CRITICAL
directory = "logs"        # relative to the project root, or an absolute path
max_file_size_mb = 5      # size at which a log file is rotated
backup_count = 5          # rotated files kept per log
# Record what you say (transcriptions) in logs/transcripts.log.
# The file stays on this machine; set to false to stop recording it.
log_transcripts = true

[language]
# Language used until the first conversation turn, and whenever the language of
# what you said cannot be detected with confidence: "pt" or "en".
default = "pt"

[activation]
# Global shortcut that starts listening. Modifiers: ctrl, alt, shift, win.
# Keys: a-z, 0-9, f1-f24, space, pause, insert, home, end, pageup, pagedown.
hotkey = "ctrl+alt+j"

[audio]
# Part of a device name, as listed by `uv run jarvis --devices`. Empty = Windows default.
input_device = ""
output_device = ""
feedback_volume = 0.25    # start/stop listening tones, from 0.0 to 1.0

[vad]
threshold = 0.5           # speech probability (0-1) above which a 32 ms frame counts as speech
# Quieter frames count as silence, so distant voices (TV, videos, people nearby) are ignored.
# Calibrate with `uv run jarvis --mic-test`.
min_speech_level_dbfs = -45.0
silence_ms = 600          # silence that marks the end of what you said
no_speech_timeout_s = 5.0 # stop listening if you say nothing
max_utterance_s = 15.0    # hard limit for one request
pre_roll_ms = 300         # audio kept from just before speech starts (first syllable)

[stt]
model = "large-v3-turbo"  # faster-whisper model name (ADR-015)
device = "cuda"           # "cuda" or "cpu" (falls back to cpu automatically if CUDA fails)
compute_type = "float16"  # float16 on GPU; int8 on CPU
beam_size = 5
# Language detection is restricted to pt/en (ADR-016). Below these confidence levels
# JARVIS keeps the language of the previous turn. Short audio needs more confidence.
short_audio_s = 1.5
min_confidence = 0.70
min_confidence_short = 0.90

[tts]
first_audio_timeout_s = 2.0   # use the offline voice if edge-tts takes longer than this
retry_online_after_s = 60     # after an edge-tts failure, stay offline for this long
cache = true                  # replay phrases already synthesised online
cache_max_mb = 50
edge_voice_en = "en-GB-RyanNeural"
edge_voice_pt = "pt-BR-AntonioNeural"
piper_voice_en = "en_GB-alan-medium"     # offline voices, downloaded on first use
piper_voice_pt = "pt_BR-faber-medium"

[confirmation]
# How long JARVIS waits for "yes" after asking before a shutdown, restart or close.
timeout_s = 6.0

[apps]
match_threshold = 85      # 0-100: how close a spoken name must be to an app or window name
refresh_minutes = 30      # how often the Start menu list is reloaded

[apps.aliases]
# Spoken name = a Start menu app name, or a URL to open in the default browser.
navegador = "https://www.google.com"
browser = "https://www.google.com"
# Abbreviations are aliases: approximate matching deliberately ignores initials.
"vs code" = "Visual Studio Code"
vscode = "Visual Studio Code"

[sites.favorites]
# Spoken name = URL. "Abre o YouTube", "open GitHub"...
google = "https://www.google.com"
youtube = "https://www.youtube.com"
gmail = "https://mail.google.com"
github = "https://github.com/VitorCamprubi"
linkedin = "https://www.linkedin.com"

[volume]
step = 10                 # percentage points for "louder" / "mais baixo"

[weather]
# Default location for weather questions. Coordinates are stored explicitly
# because several Brazilian cities share the name Sorocaba (SP, RN, SC).
city = "Sorocaba"
region = "SP"
country_code = "BR"
latitude = -23.50167
longitude = -47.45806
timezone = "America/Sao_Paulo"
